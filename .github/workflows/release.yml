name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.0.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  PYINSTALLER_VERSION: '6.11.1'

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $raw = "${{ github.ref_name }}"
          } else {
            $raw = "${{ github.event.inputs.version }}"
          }
          $ver = $raw
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_TAG=$raw" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Version: $ver (tag: $raw)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
          pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } else {
            $url = "https://files.jrsoftware.org/is/6/innosetup-6.2.2.exe"
            $installer = Join-Path $env:TEMP 'innosetup.exe'
            Invoke-WebRequest -Uri $url -OutFile $installer
            $bytes = [System.IO.File]::ReadAllBytes($installer)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid Inno Setup download" }
            Start-Process -FilePath $installer -ArgumentList '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES' -Wait
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "ISCC: $iscc"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build ToolPouch.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist\ToolPouch\ToolPouch.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found" }
          $size = (Get-Item $exe).Length
          if ($size -lt 5MB) { throw "Executable suspiciously small: $size bytes" }
          Write-Host "Verified: $exe ($([math]::Round($size / 1MB, 2)) MB)"

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC "/dMyAppVersion=$env:APP_VERSION" installer/toolpouch.iss
          Get-ChildItem dist\installer\ToolPouch-Setup-*.exe | Select-Object -First 1 | ForEach-Object {
            Write-Host "Installer: $($_.FullName)"
          }

      - name: Upload release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tool Pouch ${{ env.APP_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/installer/ToolPouch-Setup-*.exe
            dist/ToolPouch/ToolPouch.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
